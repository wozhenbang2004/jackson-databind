name: Validate inherited sealed type names
on:
  push:
    branches: [validation/sealed-inherited-name-6093]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify reported serialization mismatch
        shell: bash
        run: |
          set +e
          ./mvnw -B -ntp test -Dtest=SealedInheritedTypeName6093Test > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -ne 0
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          suite = ET.parse('target/surefire-reports/TEST-tools.jackson.databind.jsontype.SealedInheritedTypeName6093Test.xml').getroot()
          assert int(suite.attrib['tests']) == 6, suite.attrib
          assert int(suite.attrib['failures']) == 3, suite.attrib
          assert int(suite.attrib['errors']) == 0, suite.attrib
          print('Confirmed inherited name mismatches; dynamic and explicit-name controls pass')
          PYTEST
      - name: Apply lazy unnamed-type resolution and verify related behavior
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          for name in ('TypeNameIdResolver', 'SimpleNameIdResolver'):
              path = Path('src/main/java/tools/jackson/databind/jsontype/impl/' + name + '.java')
              source = path.read_text()
              before = '                if (forSer) {\n                    typeToId.put(cls.getName(), id);\n                }\n'
              after = ('                // Resolve unnamed types lazily so inherited @JsonTypeName annotations\n'
                       '                // are considered, just as they are for types not listed as subtypes.\n'
                       '                if (forSer && t.hasName()) {\n'
                       '                    typeToId.put(cls.getName(), id);\n'
                       '                }\n')
              assert source.count(before) == 1
              path.write_text(source.replace(before, after))
          PYFIX
          ./mvnw -B -ntp test '-Dtest=SealedInheritedTypeName6093Test,TestTypeNames,TestMultipleTypeNames,AbstractTypeNamesTest,TestSubtypes,SealedTypesWithSubtypesTest,JsonTypeInfoSimpleClassName4061Test,SealedTypesWithJsonTypeInfoSimpleClassName4061Test,SealedTypesWithTypedSerializationTest,SealedTypesWithTypedDeserializationTest'
